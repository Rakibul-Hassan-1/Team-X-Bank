{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="Dummy Banking System" />
    <title>{% block head_title %}Banking System{% endblock %}</title>
    <link
      href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css"
      rel="stylesheet"
    />

    {% block head_extra %}{% endblock %}
  </head>
  <body class="bg-indigo-600 min-h-screen flex flex-col">
    {% include 'navbar.html' %} {% block body %}
    <main class="flex-1 w-full px-3 sm:px-6 lg:px-8" id="main">
      <div class="max-w-6xl mx-auto">
        {% include 'messages.html' %} {% block content %} {% endblock %}
      </div>
    </main>
    {% include 'footer.html' %} {% endblock %}

    <script>
      (function () {
        var button = document.getElementById("mobile-menu-button");
        var menu = document.getElementById("mobile-menu");
        if (!button || !menu) {
          return;
        }

        button.addEventListener("click", function () {
          menu.classList.toggle("hidden");
        });
      })();
    </script>
  </body>
</html>
